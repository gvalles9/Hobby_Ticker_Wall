name: Tests and formatting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

      - name: Check formatting with black
        run: |
          pip install black
          black --check --diff .

      - name: Compile check
        run: |
          python -m py_compile flight-tracker.py version.py
          find setup display utilities scenes web -name "*.py" -exec python -m py_compile {} +

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee pytest_output.txt

      - name: Publish test results to summary
        if: always()
        shell: bash
        run: |
          if [ -f pytest_output.txt ]; then
            echo "### Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
