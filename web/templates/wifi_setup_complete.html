<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hobby Ticker Wi-Fi setup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:480px">
  <div class="alert alert-success">
    <h1 class="fs-4">Wi-Fi details saved</h1>
    <p class="mb-0">The Pi is connecting to your network. Rejoin your home Wi-Fi, then open
      <a href="http://{{ hostname }}.local:{{ web_port }}/settings">{{ hostname }}.local:{{ web_port }}/settings</a>
      to finish setup.</p>
    <p class="mt-3 mb-0 text-danger fw-bold">Bookmark this page to easily change your configuration later.</p>
  </div>
</main>
</body>
</html>
