---
name: Feature request
description: Suggest a new feature or improvement for Hobby Ticker
title: "[FEATURE] "
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem you are trying to
        solve and how the change should behave.

  - type: markdown
    attributes:
      value: |
        **Display layout:** This fork is currently configured for three
        64x32 panels (192x32 total). Mention any display-size assumptions
        relevant to your request.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your feature request related to a problem? Describe what's currently difficult or impossible to do.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the solution you'd like. Screenshots, mockups, or rough sketches are all welcome.
    validations:
      required: true
